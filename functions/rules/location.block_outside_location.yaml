expression: |
  if !data.location.is_in_location {
    // This will block for 12 hours unless the GPS refreshes to show that
    // you're in a new location
    now() + duration("12h")
  } else {
    false
  }
paramSchema:
  type_input: object
  properties:
    location:
      metadata:
        locationPicker: {}
