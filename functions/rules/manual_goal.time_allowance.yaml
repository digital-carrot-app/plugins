expression: |2
  let last_started = data.time_tracker.last_started ?? "";
  let since_start = last_started == "" ? 0 : (now() - date(last_started)).Minutes();
  let earned_minutes = sum(self.cfg.select_var, .for_each == 0 ? 0 : ((.earn_minutes ?? 0) / (.for_each ?? 0)) * data[.variable.variable_name]);
  let total_minutes = earned_minutes + self.cfg.minutes;

  earned_minutes > 0 ? setHook({
    callPluginApi: {
      function: "setTimerLimit",
      plugin: "manual_goal",
      instanceId: self.instance.linkedData["time_tracker"].dataSourceId,
      args: {minutes: total_minutes},
    },
  }) : nil;

  let remainder = total_minutes - data.time_tracker.total_time - since_start;

  progressBadge(
  	data.time_tracker.total_time, total_minutes,
  		{startTime: data.time_tracker.last_started, secondsPerUpdate: 60, unit: "minutes"},
  	);

  if data.time_tracker.current_task != "" && remainder > 0 {
  	now() + duration(string(remainder)+"m")
  } else {
  	false
  }
paramSchema:
  type_input: object
  properties:
    minutes:
      title: Minutes per Day
      description: How many minutes per day do you want to be able to unblock your distractions?
      type_input: integer
      metadata:
        unit: minutes
        display_order: 1
    select_var:
      type_input: array
      title: Additional Minutes
      description: Earn additional minutes for every step, calorie burned, and more
      default: []
      metadata:
        display_order: 2
      items:
        type_input: object
        metadata:
          object_summary:
            title_template: "Earn ${earn_minutes} minutes for every ${for_each} ${variable.pretty_name}"
        properties:
          earn_minutes:
            type_input: number
            title: Number of minutes to earn
            metadata:
              display_order: 1
          for_each:
            type_input: number
            title: For every
            metadata:
              display_order: 2
          variable:
            metadata:
              display_order: 3
              variable_picker:
                required_data_id: earn_minutes
name: Timed Unblock
requiredData:
  earn_minutes:
    name: earn minutes
    is_optional: true
    expected_output_schema:
      type_input: number
    allow_custom_variable:
    allow_multiple_select: true
  time_tracker:
    dataSources:
      default:
        pluginId: manual_goal
        functionId: time_tracker
        functionParamExpr: '{tasks: ["Unblock distractions"], max_per_timer: self.cfg.minutes}'
        createUnique: true
        dataSourceName: Timed Unblock
instanceNameTemplate: ${self.cfg.minutes} of access minutes per day
conditionWidgets:
  leftBox:
    id: timer
    plugin: manual_goal
    function: |2-
      										{
      											current_task: data.time_tracker?.current_task ?? "",
      											last_started: data.time_tracker?.last_started ?? "",
      											target_minutes: self.cfg.minutes,
      											total_time: data.time_tracker?.total_time ?? 0,
      										}

  rightBox:
    id: timer_toggle
    plugin: manual_goal
    function: |2-
      										{
      											data_source_id: self.instance.linkedData["time_tracker"].dataSourceId,
      											toggle_task_name: "Unblock distractions",
      											current_task: data.time_tracker?.current_task ?? "",
      										}

shortDescription: Lets you unblock this list for a set number of minutes per day.
boundPlugin: manual_goal
