expression: |
  if data.location.is_in_location {
    // This will block for 12 hours unless the GPS refreshes to show that
    // you're in a new location
    now() + duration("12h")
  } else {
    false
  }
paramSchema:
  type_input: object
  properties:
    location:
      metadata:
        locationPicker: {}
name: Block in Location
instanceNameTemplate: "while in location: ${ctx.appConfig.locations[self.cfg.location].name}"
requiredData:
  location:
    dataSources:
      default:
        pluginId: github.com/digital-carrot-app/plugins:location
        functionId: location
        functionParamExpr: '{location: self.cfg.location}'
        dataSourceName: Block in Location
shortDescription: Block distractions when you're in a specific location
boundPlugin: github.com/digital-carrot-app/plugins:location
quickstartMigration:
  pluginId: github.com/digital-carrot-app/plugins:location
  qsId: block_in_location
  expressionTemplate: |
    if $qs.data.location.is_in_location {
      // This will block for 12 hours unless the GPS refreshes to show that
      // you're in a new location
      now() + duration("12h")
    } else {
      false
    }
rule:
  legacyBlockTitleTemplate: Block in Location
  legacyBlockDescriptionTemplate: Block distractions when you're in a specific location
  legacyUnblockTitleTemplate: ""
  legacyUnblockDescriptionTemplate: ""
  allowedActions:
    - block_blocklist
uiConfig:
  defaultIcon:
    materialIcon: location_off
  defaultColor:
    color: magenta
