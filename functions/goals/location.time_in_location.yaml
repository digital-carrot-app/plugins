expression: |
  progressBadge(
    data.location.time_in_location, self.cfg.time_to_spend,
    {startTime: data.location.last_enter_time, secondsPerUpdate: 60, unit: "minutes"}
  );
  data.location.time_in_location >= self.cfg.time_to_spend
paramSchema:
  type_input: object
  properties:
    location:
      metadata:
        locationPicker: {}
    time_to_spend:
      title: Minutes to Spend
      description: How many minutes would you like to spend in your selected location?
      type_input: number
name: Spent time in a Location
instanceNameTemplate: "Spend ${self.cfg.time_to_spend} minutes in location: ${ctx.appConfig.locations[self.cfg.location].name}"
requiredData:
  location:
    dataSources:
      default:
        pluginId: github.com/digital-carrot-app/plugins:location
        functionId: location
        functionParamExpr: '{location: self.cfg.location}'
        dataSourceName: Spent time in a Location
shortDescription: Spent a certain amount of time in a location based on your phone's GPS
boundPlugin: github.com/digital-carrot-app/plugins:location
quickstartMigration:
  pluginId: github.com/digital-carrot-app/plugins:location
  qsId: time_in_location
  expressionTemplate: $qs.data.location.time_in_location >= $qs.cfg.time_to_spend
goal: {}
uiConfig:
  defaultIcon:
    materialIcon: location_on
  defaultColor:
    color: teal
