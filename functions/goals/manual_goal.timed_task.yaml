expression: |2-
  let task = data.time_tracker.current_task == "" ? "" : "Current timer: " + data.time_tracker.current_task;
  progressBadge(
  	data.time_tracker.total_time, self.cfg.minutes,
  	{startTime: data.time_tracker.last_started, secondsPerUpdate: 60, unit: "minutes"},
  );
  progressText(task);
  data.time_tracker.total_time >= self.cfg.minutes
  							
paramSchema:
  type_input: object
  properties:
    minutes:
      title: Minutes
      description: How much time do you want to spend on this task?
      type_input: integer
      metadata:
        unit: minutes
        displayOrder: 1
    name:
      title: Activity Name
      description: Describe the task you want to do
      type_input: string
      metadata:
        displayOrder: 1
  required:
    - name
    - minutes
name: Timed Daily Task
requiredData:
  time_tracker:
    dataSources:
      default:
        pluginId: manual_goal
        functionId: time_tracker
        functionParamExpr: '{tasks: [self.cfg.name]}'
        createUnique: true
        dataSourceName: Timed Daily Task
instanceNameTemplate: Spend ${self.cfg.minutes} minutes on '${self.cfg.name}'
conditionWidgets:
  leftBox:
    id: timer
    plugin: manual_goal
    function: |2-
      										{
      											current_task: data.time_tracker?.current_task ?? "",
      											last_started: data.time_tracker?.last_started ?? "",
      											target_minutes: self.cfg.minutes,
      											total_time: data.time_tracker?.total_time ?? 0,
      										}
      										
  rightBox:
    id: timer_toggle
    plugin: manual_goal
    function: |2-
      										{
      											data_source_id: self.instance.linkedData["time_tracker"].dataSourceId,
      											toggle_task_name: self.cfg.name,
      											current_task: data.time_tracker?.current_task ?? "",
      											target_minutes: self.cfg.minutes,
      										}
      										
shortDescription: A daily task that requires you to spend a certain amount of time on it.
boundPlugin: manual_goal
uiConfig:
  defaultIcon:
    materialIcon: timelapse
  overviewWidgets:
    toggle:
      id: timer_toggle
      plugin: manual_goal
      function: |2-
        											{
        												data_source_id: self.instance.linkedData["time_tracker"].dataSourceId,
        												toggle_task_name: self.cfg.name,
        												current_task: data.time_tracker?.current_task ?? "",
        											}
        											
  controlWidget:
    id: timer_toggle
    plugin: manual_goal
    function: |2-
      										{
      											data_source_id: self.instance.linkedData["time_tracker"].dataSourceId,
      											toggle_task_name: self.cfg.name,
      											current_task: data.time_tracker?.current_task ?? "",
      										}
      										
quickstartMigration:
  pluginId: manual_goal
  qsId: timed_task
  expressionTemplate: |2-
    let task = $qs.data.time_tracker.current_task == "" ? "" : "Current timer: " + $qs.data.time_tracker.current_task;
    progressBadge(
    	$qs.data.time_tracker.total_time, $qs.cfg.minutes,
    	{startTime: $qs.data.time_tracker.last_started, secondsPerUpdate: 60, unit: "minutes"},
    );
    progressText(task);
    $qs.data.time_tracker.total_time >= $qs.cfg.minutes
    							
goal: {}
