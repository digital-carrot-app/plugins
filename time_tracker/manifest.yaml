name: Time Tracker
description: Manually track how long you spend on specific tasks
imports:
  input:
    user_input:
  savedTime:
    storage:
      allowGlobalAccess: false
      schemaKey: currentProgress
      resets: daily

dataPlugin:
  exports:
    time_tracker:
      name: Time Tracker
      description: Manually track how long you spend on specific tasks
      paramsSchema: setTasks
      outputSchema: trackedActivities
  quickstarts:
    single_task:
      name: Spend time on a Task
      description: Spend a certain amount of time on a task of your chosing.
      userInputSchema: singleTaskQuickstart
      expressionTemplate: "$qs.time_tracker.total_time >= $qs.minutes"
      goalDescriptionTemplate: "Spend $qs.minutes on $qs.name"
      functionParamExpr: "{tasks: [name]}"
      functionId: time_tracker
      createUniqueDataSource: true

schemas:
  singleTaskQuickstart:
    properties:
      name:
        type_input: string
        title: Name
        description: Describe the task you want to do
        metadata:
          displayOrder: 1

      minutes:
        type_input: integer
        title: Minutes
        decription: How much time do you want to spend on this task?
        metadata:
          displayOrder: 1

  currentProgress:
    properties:
      currentTask:
        type_input: string
      currentStart:
        type_input: string
      taskCount:
        type_input: object
        additionalProperties:
          type_input: number

  setTasks:
    properties:
      tasks:
        type_input: array
        items:
          type_input: string
          title: Task
          description: Describe the task you want to do
  trackedActivities:
    type_input: object
    properties:
      time_per_task:
        title: Time Spent Per Task
        description: Number of minutes you spent on each individual task
        type_input: object
        additionalProperties:
          type_input: number
          metadata:
            unit: minutes
      total_time:
        type_input: number
        title: Total Minutes
        description: Number of minutes you spent on all tasks
      average_time:
        type_input: number
        title: Averge Mintues
        description: Average number of minutes spent on tasks
